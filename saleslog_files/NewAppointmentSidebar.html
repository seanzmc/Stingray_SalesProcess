<!DOCTYPE html>
<html lang="en">

<head>
    <base target="_top">
    <title>New Appointment</title>
    <style>
        body {
            font-family: Calibri, sans-serif;
            padding: 12px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-top: 6px;
        }

        button {
            margin-top: 14px;
            padding: 10px;
            width: 100%;
        }

        .hint {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.8;
        }

        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
        }

        .ok {
            background: #e8f5e9;
        }

        .err {
            background: #ffebee;
        }

        /* Tabs */
        .tab-bar {
            display: flex;
            gap: 6px;
            margin: 0 0 12px 0;
        }

        .tab-btn {
            flex: 1 1 0;
            width: auto;
            margin-top: 0;
            padding: 8px 6px;
            background: #f5f5f5;
            border: 1px solid #d0d0d0;
            border-bottom: 3px solid transparent;
            border-radius: 6px;
            font-size: 13px;
            color: #333;
            cursor: pointer;
        }

        .tab-btn.active {
            background: #fff;
            border-color: #bdbdbd;
            border-bottom-color: #4CAF50;
            font-weight: 700;
        }

        .tab-btn:focus {
            outline: 2px solid #90caf9;
            outline-offset: 1px;
        }

        .tab-sub {
            display: block;
            margin-top: 2px;
            font-size: 11px;
            font-weight: 600;
            opacity: 0.75;
        }

        .tab-panel {
            display: none;
        }

        /* Default visible tab (JS will take over after load) */
        #tab-appointment {
            display: block;
        }

        /* Panel headings */
        #tab-appointment > h3 {
            margin: 0 0 6px 0;
            color: #333;
        }

        #tab-appointment > h4 {
            margin: 0 0 10px 0;
            color: #333;
        }

        /* Phone Lead + Reassign containers */
        #phone-lead-container,
        #reassign-container {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        #phone-lead-container {
            background-color: #f0f8ff;
        }

        #reassign-container {
            background-color: #fff3e0;
        }

        /* Phone Lead styling */
        #phone-lead-container h4 {
            margin: 0 0 10px 0;
        }

        #phone-lead-container label {
            margin-top: 0;
            font-weight: 400;
        }

        #getLeadBtn {
            margin-top: 5px;
            background-color: #2196F3;
            color: white;
        }

        #undoLeadBtn {
            margin-top: 8px;
            background-color: #FF5252;
            color: white;
            padding: 6px;
            font-size: 13px;
        }

        #phoneLeadResult {
            margin-top: 8px;
            font-weight: bold;
            color: #d32f2f;
            text-align: center;
            min-height: 20px;
        }

        /* Reassign styling */
        #reassign-container h4 {
            margin: 0 0 2px 0;
        }

        #reassign-container p {
            margin: 0 0 10px 0;
            font-weight: 400;
            font-size: 13px;
        }

        #reassign-container label {
            margin-top: 0;
            font-weight: 400;
            font-size: 13px;
        }

        #reassignReason {
            margin-top: 4px;
        }

        #reassignBtn {
            margin-top: 10px;
            background-color: #FF9800;
            color: white;
        }

        #reassignResult {
            margin-top: 8px;
            font-weight: bold;
            text-align: center;
            min-height: 20px;
        }

        /* Success UI */
        #success-container {
            display: none;
            text-align: center;
            margin-top: 40px;
        }

        .success-check {
            font-size: 48px;
            color: #4CAF50;
        }

        #success-container h3 {
            margin: 10px 0;
            color: #333;
        }

        #success-details {
            margin: 20px 0;
            font-size: 14px;
            color: #555;
            line-height: 1.5;
        }
    </style>
</head>

<body>

    <div class="tab-bar" role="tablist" aria-label="Sidebar Sections">
        <button type="button" class="tab-btn active" data-tab="tab-appointment" aria-controls="tab-appointment"
            aria-selected="true" onclick="setActiveTab('tab-appointment')">Appointment</button>
        <button type="button" class="tab-btn" data-tab="tab-phone-lead" aria-controls="tab-phone-lead"
            aria-selected="false" onclick="setActiveTab('tab-phone-lead')">Phone Lead</button>
        <button type="button" class="tab-btn" data-tab="tab-manage" aria-controls="tab-manage" aria-selected="false"
            onclick="setActiveTab('tab-manage')">Manage<span class="tab-sub">Reassign workflows</span></button>
    </div>

    <div id="tab-appointment" class="tab-panel" role="tabpanel">
        <h3>New Appointment</h3>

        <h4>Appointment Details</h4>

        <div id="form-container">
            <label>Appointment date/time</label>
            <input id="apptIso" type="datetime-local">

            <label>Customer name</label>
            <input id="customerName" type="text" placeholder="John Smith">

            <label>Phone</label>
            <input id="phone" type="tel" placeholder="813-555-1234">

            <label>Assigned By</label>
            <select id="assignedByName"></select>

            <label>Notes (optional)</label>
            <textarea id="notes" rows="3" placeholder="Anything helpful..."></textarea>



            <button id="submitBtn" type="button" onclick="submit()">Create &amp; Assign</button>

            <div class="hint">This will auto-assign to the next eligible salesperson and advance the queue.</div>
        </div>

        <div id="success-container">
            <div class="success-check">&#10004;</div>
            <h3>Appointment Created</h3>
            <div id="success-details"></div>
            <button type="button" onclick="google.script.host.close()">Close</button>
        </div>

        <div id="status"></div>
    </div>

    <div id="tab-phone-lead" class="tab-panel" role="tabpanel">
        <div id="phone-lead-container">
            <h4>Phone Lead System</h4>
            <label>Need a Salesperson?</label>
            <button id="getLeadBtn" type="button" onclick="getPhoneLead()">Assign Phone Lead</button>
            <button id="undoLeadBtn" type="button" onclick="undoPhoneLead()">↺ Recall / Undo Last Assignment</button>
            <div id="phoneLeadResult"></div>
        </div>
    </div>

    <div id="tab-manage" class="tab-panel" role="tabpanel">
        <div id="reassign-container">
            <h4>Reassign Appointment</h4>
            <p>Select the row to reassign
                on the APPOINTMENTS sheet.</p>
            <label>Reason:</label>
            <select id="reassignReason">
                <option>Loading...</option>
            </select>
            <button id="reassignBtn" type="button" onclick="reassignRow()">Reassign</button>
            <div id="reassignResult">
            </div>
        </div>
    </div>

    <script>
        // Helper to get local ISO string for datetime-local
        function getLocalIsoString() {
            const now = new Date();
            // Round minutes to nearest 15
            const minutes = now.getMinutes();
            const remainder = minutes % 15;
            if (remainder >= 8) {
                now.setMinutes(minutes + (15 - remainder));
            } else {
                now.setMinutes(minutes - remainder);
            }
            now.setSeconds(0);
            now.setMilliseconds(0);

            // Adjustment for local time zone offset to fit datetime-local format (YYYY-MM-DDTHH:mm)
            // datetime-local expects local time, but toISOString is UTC.
            // We shift the date by the timezone offset.
            const offsetMs = now.getTimezoneOffset() * 60 * 1000;
            const localDate = new Date(now.getTime() - offsetMs);
            return localDate.toISOString().slice(0, 16);
        }

        function loadAssignedBy() {
            // Set default date immediately
            const isoStr = getLocalIsoString();
            document.getElementById('apptIso').value = isoStr;

            google.script.run
                .withSuccessHandler((result) => {
                    // Result is now { users: string[], lastSelected: string }
                    const names = result.users || [];
                    const lastSelected = result.lastSelected || '';

                    const sel = document.getElementById('assignedByName');
                    sel.innerHTML = '';

                    const placeholder = document.createElement('option');
                    placeholder.value = '';
                    placeholder.textContent = 'Select…';
                    sel.appendChild(placeholder);

                    names.forEach(n => {
                        const opt = document.createElement('option');
                        opt.value = n;
                        opt.textContent = n;
                        if (n === lastSelected) {
                            opt.selected = true;
                        }
                        sel.appendChild(opt);
                    });
                })
                .withFailureHandler((err) => {
                    setStatus('Failed to load Assigned By list: ' + (err?.message || err), false);
                })
                .getAssignmentUsers();
        }

        // Run when sidebar loads
        window.onload = loadAssignedBy;

        function setStatus(msg, ok) {
            const el = document.getElementById('status');
            el.className = 'status ' + (ok ? 'ok' : 'err');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function disable(disabled) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = disabled;
            if (disabled) {
                btn.textContent = 'Submitting...';
            } else {
                btn.textContent = 'Create & Assign';
            }
        }

        function submit() {
            const payload = {
                apptIso: document.getElementById('apptIso').value,
                customerName: document.getElementById('customerName').value,
                phone: document.getElementById('phone').value,
                notes: document.getElementById('notes').value,
                assignedByName: document.getElementById('assignedByName').value
            };

            if (!payload.apptIso || !payload.customerName || !payload.phone || !payload.assignedByName) {
                setStatus('Please fill appointment date/time, customer name, phone, and assigned by.', false);
                return;
            }

            setStatus('', true); // Clear status
            document.getElementById('status').style.display = 'none';

            disable(true);
            google.script.run
                .withSuccessHandler((res) => {
                    disable(false);
                    if (res && res.ok) {
                        // Hide form, show success
                        document.getElementById('form-container').style.display = 'none';
                        document.getElementById('status').style.display = 'none'; // hide any old status

                        const details = `<strong>Assigned to:</strong> ${res.assignedTo}<br>` +
                            `<strong>Next up:</strong> ${res.nextUp || '(none)'}`;

                        const successDiv = document.getElementById('success-container');
                        document.getElementById('success-details').innerHTML = details;
                        successDiv.style.display = 'block';

                    } else {
                        setStatus(res.message || 'Unexpected response from server.', false);
                    }
                })
                .withFailureHandler((err) => {
                    disable(false);
                    setStatus(err && err.message ? err.message : String(err), false);
                })
                .createAppointmentFromSidebar(payload);
        }

        // New Phone Lead Handler
        function getPhoneLead() {
            const btn = document.getElementById('getLeadBtn');
            const resultDiv = document.getElementById('phoneLeadResult');

            btn.disabled = true;
            btn.textContent = 'Assigning...';
            resultDiv.textContent = '';

            google.script.run
                .withSuccessHandler((assignedName) => {
                    btn.disabled = false;
                    btn.textContent = 'Get Phone Lead';
                    resultDiv.textContent = 'Assigned: ' + assignedName;
                })
                .withFailureHandler((err) => {
                    btn.disabled = false;
                    btn.textContent = 'Get Phone Lead';
                    resultDiv.textContent = 'Error: ' + (err.message || err);
                })
                .assignPhoneLead();
        }

        // Undo Phone Lead Handler
        function undoPhoneLead() {
            if (!confirm('Are you sure you want to rewind the rotation? This will set the pointer back to the previous person.')) return;

            const btn = document.getElementById('undoLeadBtn');
            const resultDiv = document.getElementById('phoneLeadResult');

            btn.disabled = true;
            btn.textContent = 'Rewinding...';
            resultDiv.textContent = '';

            google.script.run
                .withSuccessHandler((msg) => {
                    btn.disabled = false;
                    btn.textContent = '↺ Recall / Undo Last Assignment';
                    resultDiv.textContent = msg;
                    resultDiv.style.color = '#388E3C'; // Green
                })
                .withFailureHandler((err) => {
                    btn.disabled = false;
                    btn.textContent = '↺ Recall / Undo Last Assignment';
                    resultDiv.textContent = 'Error: ' + (err.message || err);
                    resultDiv.style.color = '#d32f2f'; // Red
                })
                .undoLastPhoneUp();
        }

        // Reassign Row Handler
        function reassignRow() {
            const reason = document.getElementById('reassignReason').value;
            const btn = document.getElementById('reassignBtn');
            const resultDiv = document.getElementById('reassignResult');

            if (!reason) {
                resultDiv.textContent = 'Please select a reason.';
                resultDiv.style.color = 'red';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Reassigning...';
            resultDiv.textContent = '';
            resultDiv.style.color = 'black';

            google.script.run
                .withSuccessHandler((res) => {
                    btn.disabled = false;
                    btn.textContent = 'Reassign';

                    if (res.ok) {
                        resultDiv.textContent = 'New Assignee: ' + res.newAssignee;
                        resultDiv.style.color = 'green';
                    } else {
                        resultDiv.textContent = 'Error: ' + res.message;
                        resultDiv.style.color = 'red';
                    }
                })
                .withFailureHandler((err) => {
                    btn.disabled = false;
                    btn.textContent = 'Reassign';
                    resultDiv.textContent = 'Error: ' + (err.message || err);
                    resultDiv.style.color = 'red';
                })
                .reassignSelectedRow(reason); // This calls the server-side function which now validates against allowlist (optionally)
        }

        function loadReassignReasons() {
             google.script.run
                .withSuccessHandler((reasons) => {
                    const sel = document.getElementById('reassignReason');
                    sel.innerHTML = ''; // Clear loading/static options
                    reasons.forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r;
                        opt.textContent = r;
                        sel.appendChild(opt);
                    });
                })
                .withFailureHandler((err) => {
                     console.error("Failed to load reasons", err);
                     // Fallback or show error in select
                     const sel = document.getElementById('reassignReason');
                     sel.innerHTML = '<option>Error loading reasons</option>';
                })
                .getReassignmentReasons();
        }

        // Add to window.onload
        const originalOnLoad = window.onload;
        window.onload = function() {
            if (originalOnLoad) originalOnLoad();
            loadReassignReasons();
        };

        // Tab switching
        function setActiveTab(tabId) {
            const panels = document.querySelectorAll('.tab-panel');
            panels.forEach((p) => {
                p.style.display = (p.id === tabId) ? 'block' : 'none';
            });

            const buttons = document.querySelectorAll('.tab-btn');
            buttons.forEach((b) => {
                const isActive = b.getAttribute('data-tab') === tabId;
                b.classList.toggle('active', isActive);
                b.setAttribute('aria-selected', String(isActive));
            });
        }

        // Default tab
        setActiveTab('tab-appointment');
    </script>
</body>

</html>
