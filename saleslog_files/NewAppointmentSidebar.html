<!doctype html>
<html>

<head>
    <base target="_top">
    <style>
        body {
            font-family: Calibri, sans-serif;
            padding: 12px;
        }

        label {
            display: block;
            margin-top: 10px;
            font-weight: 600;
        }

        input,
        textarea,
        select {
            width: 100%;
            box-sizing: border-box;
            padding: 8px;
            margin-top: 6px;
        }

        button {
            margin-top: 14px;
            padding: 10px;
            width: 100%;
        }

        .hint {
            margin-top: 10px;
            font-size: 12px;
            opacity: 0.8;
        }

        .status {
            margin-top: 12px;
            padding: 10px;
            border-radius: 6px;
        }

        .ok {
            background: #e8f5e9;
        }

        .err {
            background: #ffebee;
        }
    </style>
</head>

<body>


    <div id="phone-lead-container"
        style="margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: #f0f8ff;">
        <h4 style="margin-top: 0; margin-bottom: 10px;">Phone Lead System</h4>
        <label style="margin-top:0; font-weight: normal;">Need a Salesperson?</label>
        <button id="getLeadBtn" type="button" onclick="getPhoneLead()"
            style="margin-top: 5px; background-color: #2196F3; color: white;">Assign Phone Lead</button>
        <div id="phoneLeadResult"
            style="margin-top: 8px; font-weight: bold; color: #d32f2f; text-align: center; min-height: 20px;"></div>
    </div>



    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <h3 style="margin-top: 0;">New Appointment</h3>

    <h4 style="margin-top: 0;">Appointment Details</h4>

    <div id="form-container">
        <label>Appointment date/time</label>
        <input id="apptIso" type="datetime-local" />

        <label>Customer name</label>
        <input id="customerName" type="text" placeholder="John Smith" />

        <label>Phone</label>
        <input id="phone" type="tel" placeholder="813-555-1234" />

        <label>Assigned By</label>
        <select id="assignedByName"></select>

        <label>Notes (optional)</label>
        <textarea id="notes" rows="3" placeholder="Anything helpful..."></textarea>



        <button id="submitBtn" type="button" onclick="submit()">Create & Assign</button>

        <div class="hint">This will auto-assign to the next eligible salesperson and advance the queue.</div>
    </div>

    <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">

    <div id="reassign-container"
        style="margin-bottom: 20px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; background-color: #fff3e0;">
        <h4 style="margin-top: 0; margin-bottom: 2px;">Reassign Appointment</h4>
        <p style="margin-top: 0; margin-bottom: 10px; font-weight: normal; font-size: 13px;">Select the row to reassign
            on the APPOINTMENTS sheet.</p>
        <label style="margin-top:0; font-weight: normal; font-size: 13px;">Reason:</label>
        <select id="reassignReason" style="margin-top: 4px;">
            <option>Loading...</option>
        </select>
        <button id="reassignBtn" type="button" onclick="reassignRow()"
            style="margin-top: 10px; background-color: #FF9800; color: white;">Reassign</button>
        <div id="reassignResult" style="margin-top: 8px; font-weight: bold; text-align: center; min-height: 20px;">
        </div>
    </div>

    <div id="success-container" style="display:none; text-align: center; margin-top: 40px;">
        <div style="font-size: 48px; color: #4CAF50;">&#10004;</div>
        <h3 style="margin: 10px 0; color: #333;">Appointment Created</h3>
        <div id="success-details" style="margin: 20px 0; font-size: 14px; color: #555; line-height: 1.5;"></div>
        <button onclick="google.script.host.close()">Close</button>
    </div>

    <div id="status"></div>

    <script>
        // Helper to get local ISO string for datetime-local
        function getLocalIsoString() {
            const now = new Date();
            // Round minutes to nearest 15
            const minutes = now.getMinutes();
            const remainder = minutes % 15;
            if (remainder >= 8) {
                now.setMinutes(minutes + (15 - remainder));
            } else {
                now.setMinutes(minutes - remainder);
            }
            now.setSeconds(0);
            now.setMilliseconds(0);

            // Adjustment for local time zone offset to fit datetime-local format (YYYY-MM-DDTHH:mm)
            // datetime-local expects local time, but toISOString is UTC.
            // We shift the date by the timezone offset.
            const offsetMs = now.getTimezoneOffset() * 60 * 1000;
            const localDate = new Date(now.getTime() - offsetMs);
            return localDate.toISOString().slice(0, 16);
        }

        function loadAssignedBy() {
            // Set default date immediately
            const isoStr = getLocalIsoString();
            document.getElementById('apptIso').value = isoStr;

            google.script.run
                .withSuccessHandler((result) => {
                    // Result is now { users: string[], lastSelected: string }
                    const names = result.users || [];
                    const lastSelected = result.lastSelected || '';

                    const sel = document.getElementById('assignedByName');
                    sel.innerHTML = '';

                    const placeholder = document.createElement('option');
                    placeholder.value = '';
                    placeholder.textContent = 'Select…';
                    sel.appendChild(placeholder);

                    names.forEach(n => {
                        const opt = document.createElement('option');
                        opt.value = n;
                        opt.textContent = n;
                        if (n === lastSelected) {
                            opt.selected = true;
                        }
                        sel.appendChild(opt);
                    });
                })
                .withFailureHandler((err) => {
                    setStatus('Failed to load Assigned By list: ' + (err?.message || err), false);
                })
                .getAssignmentUsers();
        }

        // Run when sidebar loads
        window.onload = loadAssignedBy;

        function setStatus(msg, ok) {
            const el = document.getElementById('status');
            el.className = 'status ' + (ok ? 'ok' : 'err');
            el.textContent = msg;
            el.style.display = 'block';
        }

        function disable(disabled) {
            const btn = document.getElementById('submitBtn');
            btn.disabled = disabled;
            if (disabled) {
                btn.textContent = 'Submitting...';
            } else {
                btn.textContent = 'Create & Assign';
            }
        }

        function submit() {
            const payload = {
                apptIso: document.getElementById('apptIso').value,
                customerName: document.getElementById('customerName').value,
                phone: document.getElementById('phone').value,
                notes: document.getElementById('notes').value,
                assignedByName: document.getElementById('assignedByName').value
            };

            if (!payload.apptIso || !payload.customerName || !payload.phone || !payload.assignedByName) {
                setStatus('Please fill appointment date/time, customer name, phone, and assigned by.', false);
                return;
            }

            setStatus('', true); // Clear status
            document.getElementById('status').style.display = 'none';

            disable(true);
            google.script.run
                .withSuccessHandler((res) => {
                    disable(false);
                    if (res && res.ok) {
                        // Hide form, show success
                        document.getElementById('form-container').style.display = 'none';
                        document.getElementById('status').style.display = 'none'; // hide any old status

                        const details = `<strong>Assigned to:</strong> ${res.assignedTo}<br>` +
                            `<strong>Next up:</strong> ${res.nextUp || '(none)'}`;

                        const successDiv = document.getElementById('success-container');
                        document.getElementById('success-details').innerHTML = details;
                        successDiv.style.display = 'block';

                    } else {
                        setStatus(res.message || 'Unexpected response from server.', false);
                    }
                })
                .withFailureHandler((err) => {
                    disable(false);
                    setStatus(err && err.message ? err.message : String(err), false);
                })
                .createAppointmentFromSidebar(payload);
        }

        // New Phone Lead Handler
        function getPhoneLead() {
            const btn = document.getElementById('getLeadBtn');
            const resultDiv = document.getElementById('phoneLeadResult');

            btn.disabled = true;
            btn.textContent = 'Assigning...';
            resultDiv.textContent = '';

            google.script.run
                .withSuccessHandler((assignedName) => {
                    btn.disabled = false;
                    btn.textContent = 'Get Phone Lead';
                    resultDiv.textContent = 'Assigned: ' + assignedName;
                })
                .withFailureHandler((err) => {
                    btn.disabled = false;
                    btn.textContent = 'Get Phone Lead';
                    resultDiv.textContent = 'Error: ' + (err.message || err);
                })
                .assignPhoneLead();
        }

        // Reassign Row Handler
        function reassignRow() {
            const reason = document.getElementById('reassignReason').value;
            const btn = document.getElementById('reassignBtn');
            const resultDiv = document.getElementById('reassignResult');

            if (!reason) {
                resultDiv.textContent = 'Please select a reason.';
                resultDiv.style.color = 'red';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Reassigning...';
            resultDiv.textContent = '';
            resultDiv.style.color = 'black';

            google.script.run
                .withSuccessHandler((res) => {
                    btn.disabled = false;
                    btn.textContent = 'Reassign';

                    if (res.ok) {
                        resultDiv.textContent = 'New Assignee: ' + res.newAssignee;
                        resultDiv.style.color = 'green';
                    } else {
                        resultDiv.textContent = 'Error: ' + res.message;
                        resultDiv.style.color = 'red';
                    }
                })
                .withFailureHandler((err) => {
                    btn.disabled = false;
                    btn.textContent = 'Reassign';
                    resultDiv.textContent = 'Error: ' + (err.message || err);
                    resultDiv.style.color = 'red';
                })
                .reassignSelectedRow(reason); // This calls the server-side function which now validates against allowlist (optionally)
        }

        function loadReassignReasons() {
             google.script.run
                .withSuccessHandler((reasons) => {
                    const sel = document.getElementById('reassignReason');
                    sel.innerHTML = ''; // Clear loading/static options
                    reasons.forEach(r => {
                        const opt = document.createElement('option');
                        opt.value = r;
                        opt.textContent = r;
                        sel.appendChild(opt);
                    });
                })
                .withFailureHandler((err) => {
                     console.error("Failed to load reasons", err);
                     // Fallback or show error in select
                     const sel = document.getElementById('reassignReason');
                     sel.innerHTML = '<option>Error loading reasons</option>';
                })
                .getReassignmentReasons();
        }

        // Add to window.onload
        const originalOnLoad = window.onload;
        window.onload = function() {
            if (originalOnLoad) originalOnLoad();
            loadReassignReasons();
        };
    </script>
</body>

</html>
