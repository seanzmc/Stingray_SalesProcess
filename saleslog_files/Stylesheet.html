<style>
  body {
    font-family: sans-serif;
    padding: 10px;
    line-height: 1.35;
  }
  h2 {
    margin: 0 0 10px 0;
    font-size: 18px;
  }
  .panel {
    border: 1px solid #e3e3e3;
    border-radius: 6px;
    padding: 10px;
    margin-bottom: 12px;
  }
  .panel h3 {
    margin: 0 0 8px 0;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    color: #444;
  }
  .panel table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .panel td {
    padding: 4px 6px;
    vertical-align: top;
  }
  .panel td.key {
    color: #555;
    font-weight: 600;
  }
  .panel td.val {
    color: #111;
    word-break: break-word;
  }
  body > select,
  body > button {
    width: 100%;
    padding: 8px;
    box-sizing: border-box;
  }
  body > button {
    border: none;
    cursor: pointer;
  }
  button.cancel {
    background-color: #ccc;
    color: black;
  }
  button.cancel:hover {
    background-color: #bdbdbd;
  }
  .error {
    margin-top: 10px;
    padding: 10px;
    border: 1px solid #e53935;
    background: #ffebee;
    color: #b71c1c;
    border-radius: 6px;
    display: none;
    white-space: pre-wrap;
  }
  .muted {
    color: #666;
    font-size: 12px;
  }
  .hidden {
    display: none;
  }
</style>
