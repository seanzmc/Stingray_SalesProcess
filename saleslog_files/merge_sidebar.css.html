<style>
  /* ========================================================================
   CDK MERGE TOOL SIDEBAR STYLING
   Material Design styling matching Sales Log Pro aesthetic
   ======================================================================== */

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    font-family: 'Roboto', 'Arial', sans-serif;
    font-size: 14px;
    line-height: 1.5;
    color: var(--text-primary);
    background-color: var(--bg-primary);
    padding: 0;
    margin: 0;
  }

  /* Progress Indicator */
  .progress-indicator {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--spacing-md);
    background-color: var(--bg-secondary);
    border-bottom: 1px solid var(--border-color);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .progress-step {
    display: flex;
    flex-direction: column;
    align-items: center;
    position: relative;
  }

  .progress-dot {
    width: 24px;
    height: 24px;
    border-radius: 50%;
    background-color: white;
    border: 2px solid var(--border-color);
    transition: all 0.3s;
  }

  .progress-step.active .progress-dot {
    background-color: var(--primary-blue);
    border-color: var(--primary-blue);
  }

  .progress-step.completed .progress-dot {
    background-color: var(--success-green);
    border-color: var(--success-green);
  }

  .progress-step.completed .progress-dot::after {
    content: '✓';
    color: white;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 12px;
  }

  .progress-label {
    font-size: 11px;
    color: var(--text-secondary);
    margin-top: var(--spacing-xs);
    white-space: nowrap;
  }

  .progress-step.active .progress-label {
    color: var(--primary-blue);
    font-weight: 500;
  }

  .progress-line {
    flex: 1;
    height: 2px;
    background-color: var(--border-color);
    margin: 0 var(--spacing-xs);
  }

  .progress-step.completed ~ .progress-line {
    background-color: var(--success-green);
  }

  /* Step Container */
  .step-container {
    display: none;
    padding: var(--spacing-md);
    animation: fadeIn 0.3s;
  }

  .step-container.active {
    display: block;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* Section Headers */
  .section-header {
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: var(--spacing-md);
    padding-bottom: var(--spacing-sm);
    border-bottom: 1px solid var(--border-color);
  }

  /* File Upload Area */
  .upload-area {
    border: 2px dashed var(--border-color);
    border-radius: 8px;
    padding: var(--spacing-lg);
    text-align: center;
    cursor: pointer;
    transition: all 0.2s;
    background-color: var(--bg-secondary);
  }

  .upload-area:hover {
    border-color: var(--primary-blue);
    background-color: var(--bg-hover);
  }

  .upload-area.drag-over {
    border-color: var(--primary-blue);
    background-color: var(--bg-hover);
    transform: scale(1.02);
  }

  .upload-area.has-file {
    border-color: var(--success-green);
    background-color: #e8f5e9;
  }

  .upload-icon {
    font-size: 48px;
    margin-bottom: var(--spacing-sm);
  }

  .upload-text {
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: var(--spacing-xs);
  }

  .upload-help {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* File Info */
  .file-info {
    background-color: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: var(--spacing-md);
    margin-top: var(--spacing-md);
  }

  .file-name {
    font-weight: 500;
    font-size: 14px;
    color: var(--text-primary);
    margin-bottom: var(--spacing-xs);
  }

  .file-details {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: var(--spacing-sm);
  }

  /* File Preview */
  .file-preview {
    margin-top: var(--spacing-md);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: var(--spacing-md);
  }

  .preview-header {
    font-weight: 500;
    margin-bottom: var(--spacing-sm);
  }

  .preview-content {
    font-size: 12px;
    font-family: 'Courier New', monospace;
    background-color: var(--bg-secondary);
    padding: var(--spacing-sm);
    border-radius: 4px;
    overflow-x: auto;
    white-space: pre;
  }

  /* Config Section */
  .config-section {
    background-color: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: var(--spacing-md);
    margin-bottom: var(--spacing-md);
  }

  .config-header {
    font-weight: 500;
    font-size: 14px;
    margin-bottom: var(--spacing-md);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .auto-detected {
    color: var(--success-green);
    font-size: 12px;
  }

  /* Form Elements */
  .form-group {
    margin-bottom: var(--spacing-md);
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: var(--spacing-xs);
  }

  .form-select,
  input[type="text"],
  input[type="number"] {
    width: 100%;
    padding: 10px;
    border: 1px solid var(--border-color);
    border-radius: 4px;
    font-size: 14px;
    font-family: inherit;
    transition: border-color 0.2s;
  }

  .form-select:focus,
  input[type="text"]:focus,
  input[type="number"]:focus {
    outline: none;
    border-color: var(--primary-blue);
    box-shadow: 0 0 0 2px rgba(66, 133, 244, 0.1);
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    padding: var(--spacing-sm) 0;
    cursor: pointer;
  }

  .checkbox-label input[type="checkbox"] {
    width: 18px;
    height: 18px;
    margin-right: var(--spacing-sm);
    cursor: pointer;
  }

  .slider {
    width: 100%;
    height: 6px;
    border-radius: 3px;
    background: var(--border-color);
    outline: none;
    -webkit-appearance: none;
  }

  .slider::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary-blue);
    cursor: pointer;
  }

  .slider::-moz-range-thumb {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--primary-blue);
    cursor: pointer;
    border: none;
  }

  /* Progress Bar */
  .progress-container {
    margin: var(--spacing-lg) 0;
  }

  .status-message {
    text-align: center;
    font-weight: 500;
    margin-bottom: var(--spacing-md);
    color: var(--primary-blue);
  }

  .progress-bar {
    width: 100%;
    height: 24px;
    background-color: var(--bg-secondary);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: var(--spacing-sm);
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--primary-blue), var(--success-green));
    transition: width 0.3s ease;
    border-radius: 12px;
    width: 0%;
  }

  .progress-text {
    text-align: center;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: var(--spacing-sm);
  }

  .time-estimate {
    text-align: center;
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* Stats Preview */
  .stats-preview {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--spacing-sm);
    margin: var(--spacing-lg) 0;
  }

  .stat-card {
    background-color: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 4px;
    padding: var(--spacing-md);
    text-align: center;
  }

  .stat-label {
    font-size: 12px;
    color: var(--text-secondary);
    margin-bottom: var(--spacing-xs);
  }

  .stat-value {
    font-size: 24px;
    font-weight: bold;
    color: var(--primary-blue);
  }

  /* Summary Card */
  .summary-card {
    background-color: var(--bg-secondary);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    padding: var(--spacing-md);
    margin-bottom: var(--spacing-md);
  }

  .summary-header {
    font-weight: 500;
    font-size: 14px;
    margin-bottom: var(--spacing-md);
    padding-bottom: var(--spacing-sm);
    border-bottom: 1px solid var(--border-color);
  }

  .summary-content {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
  }

  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .summary-row.highlight {
    padding: var(--spacing-sm);
    background-color: var(--bg-hover);
    border-radius: 4px;
    font-weight: 500;
  }

  .summary-label {
    font-size: 13px;
    color: var(--text-secondary);
  }

  .summary-value {
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
  }

  /* Review Section */
  .review-section {
    margin: var(--spacing-lg) 0;
  }

  .review-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: var(--spacing-sm);
    background-color: var(--bg-secondary);
    border-radius: 4px;
    margin-bottom: var(--spacing-sm);
    cursor: pointer;
  }

  .review-count {
    background-color: var(--warning-yellow);
    color: white;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 500;
  }

  .review-list {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
  }

  .review-card {
    background-color: white;
    border: 1px solid var(--border-color);
    border-left: 4px solid var(--warning-yellow);
    border-radius: 4px;
    padding: var(--spacing-md);
  }

  .review-card-header {
    font-weight: 500;
    margin-bottom: var(--spacing-sm);
  }

  .review-card-details {
    font-size: 12px;
    color: var(--text-secondary);
    margin: var(--spacing-xs) 0;
  }

  .review-card-actions {
    display: flex;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-md);
  }

  /* Completion Card */
  .completion-card {
    text-align: center;
    padding: var(--spacing-xl);
    background-color: var(--bg-secondary);
    border-radius: 8px;
    margin-bottom: var(--spacing-lg);
  }

  .completion-icon {
    font-size: 64px;
    color: var(--success-green);
    margin-bottom: var(--spacing-md);
  }

  .completion-title {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: var(--spacing-sm);
  }

  .completion-time {
    font-size: 12px;
    color: var(--text-secondary);
  }

  /* Output Section */
  .output-section {
    margin: var(--spacing-md) 0;
  }

  .output-label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: var(--spacing-xs);
  }

  .btn-link {
    background: none;
    border: none;
    color: var(--primary-blue);
    text-decoration: underline;
    cursor: pointer;
    font-size: 14px;
    padding: var(--spacing-xs) 0;
    text-align: left;
  }

  .btn-link:hover {
    color: var(--primary-dark);
  }

  /* Next Steps */
  .next-steps {
    background-color: var(--bg-secondary);
    border-radius: 4px;
    padding: var(--spacing-md);
    margin: var(--spacing-lg) 0;
  }

  .next-steps ul {
    margin-left: var(--spacing-lg);
    margin-top: var(--spacing-sm);
  }

  .next-steps li {
    font-size: 13px;
    color: var(--text-secondary);
    margin: var(--spacing-xs) 0;
  }

  /* Buttons */
  button {
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    padding: 10px 24px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
    min-height: 44px;
  }

  .btn-primary {
    background-color: var(--primary-blue);
    color: white;
  }

  .btn-primary:hover:not(:disabled) {
    background-color: var(--primary-dark);
    box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
  }

  .btn-primary:disabled {
    background-color: var(--text-disabled);
    cursor: not-allowed;
    opacity: 0.5;
  }

  .btn-secondary {
    background-color: white;
    color: var(--primary-blue);
    border: 1px solid var(--border-color);
  }

  .btn-secondary:hover {
    background-color: var(--bg-secondary);
  }

  .btn-small {
    padding: 6px 16px;
    font-size: 13px;
    min-height: 36px;
  }

  .button-group {
    display: flex;
    gap: var(--spacing-sm);
    margin-top: var(--spacing-lg);
  }

  .button-group button {
    flex: 1;
  }

  /* Loading Overlay */
  .loading-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-color: rgba(255, 255, 255, 0.9);
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
  }

  .spinner {
    border: 4px solid var(--bg-secondary);
    border-top: 4px solid var(--primary-blue);
    border-radius: 50%;
    width: 50px;
    height: 50px;
    animation: spin 1s linear infinite;
  }

  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .loading-message {
    margin-top: var(--spacing-md);
    font-size: 14px;
    color: var(--text-secondary);
  }

  /* Toast Notification */
  .toast {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background-color: #323232;
    color: white;
    padding: 12px 24px;
    border-radius: 4px;
    font-size: 14px;
    z-index: 1001;
    display: none;
    min-width: 200px;
    text-align: center;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.3);
  }

  .toast.active {
    display: block;
    animation: slideUp 0.3s;
  }

  .toast.error {
    background-color: var(--danger-red);
  }

  .toast.success {
    background-color: var(--success-green);
  }

  @keyframes slideUp {
    from {
      bottom: -50px;
      opacity: 0;
    }
    to {
      bottom: 20px;
      opacity: 1;
    }
  }

  /* Help Text */
  .help-text {
    font-size: 12px;
    color: var(--text-secondary);
    margin-top: var(--spacing-xs);
  }

  /* Hidden class */
  .hidden {
    display: none !important;
  }

  /* Responsive adjustments */
  @media (max-width: 320px) {
    .progress-indicator {
      padding: var(--spacing-sm);
    }

    .progress-label {
      font-size: 10px;
    }

    .step-container {
      padding: var(--spacing-sm);
    }

    .stats-preview {
      grid-template-columns: 1fr;
    }

    .button-group {
      flex-direction: column;
    }

    .button-group button {
      width: 100%;
    }
  }
</style>
