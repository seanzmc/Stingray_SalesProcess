    <script>
      // ========================================================================
      // CLIENT-SIDE JAVASCRIPT
      // Handles UI interactions, validation, and server communication
      // ========================================================================

      // DIAGNOSTIC: Log script loading
      console.log('[DEBUG] sidebar_js.html script block starting to load...');

      // Use configuration data injected by parent HTML file
      // This avoids scriptlet processing issues inside included files
      const INITIAL_CONFIG = window.__SIDEBAR_INITIAL_CONFIG__ || '{}';
      const FEATURE_FLAGS = window.__SIDEBAR_FEATURE_FLAGS__ || {
        hasSalespeople: false,
        hasCustomColors: false,
        skipSundays: true,
        mondayLogsSaturday: true
      };
      
      console.log('[DEBUG] Using injected config. INITIAL_CONFIG length:', INITIAL_CONFIG.length);
      console.log('[DEBUG] FEATURE_FLAGS:', FEATURE_FLAGS);

      // Configuration cache
      let configCache = null;
      let editingMode = false;

      // Initialize on load
      window.addEventListener('DOMContentLoaded', function () {
        loadConfiguration();
        setupEventListeners();
      });

      // ========================================================================
      // TAB MANAGEMENT
      // ========================================================================

      /**
       * Switches between sidebar tabs
       * @param {string} tabName - The name of the tab to switch to
       */
      window.switchTab = function(tabName) {
        console.log('[DEBUG] switchTab called with:', tabName);
        
        // Update tab buttons
        const tabs = document.querySelectorAll('.tab');
        tabs.forEach(tab => tab.classList.remove('active'));
        
        // Find the clicked tab by matching the onclick attribute
        tabs.forEach(tab => {
          if (tab.getAttribute('onclick') && tab.getAttribute('onclick').includes("'" + tabName + "'")) {
            tab.classList.add('active');
          }
        });

        // Update tab content
        const contents = document.querySelectorAll('.tab-content');
        contents.forEach(content => content.classList.remove('active'));
        document.getElementById('tab-' + tabName).classList.add('active');
        
        console.log('[DEBUG] switchTab completed for:', tabName);
      };
      
      console.log('[DEBUG] switchTab function defined on window:', typeof window.switchTab);

      // ========================================================================
      // CONFIGURATION LOADING
      // ========================================================================

      function loadConfiguration() {
        // Use server-injected initial configuration (no API call needed on first load)
        try {
          const config = JSON.parse(INITIAL_CONFIG);
          configCache = config;
          populateUI(config);
          
          // Log successful load from injected data
          console.log('Configuration loaded from server injection (no API call)');
        } catch (e) {
          // Fallback to API call if injection fails
          console.warn('Failed to parse injected config, falling back to API call:', e);
          showLoading(true);
          
          google.script.run
            .withSuccessHandler(function (config) {
              configCache = config;
              populateUI(config);
              showLoading(false);
            })
            .withFailureHandler(function (error) {
              showToast('Error loading configuration: ' + error.message, 'error');
              showLoading(false);
            })
            .getConfiguration();
        }
      }

      function populateUI(config) {
  // Populate visual settings
  if (config.visual) {
    setColorValue('color-nondelivered', config.visual.nonDeliveredColor);
    setColorValue('color-salesperson-error', config.visual.salespersonErrorColor);
    setColorValue('color-duplicate-fill', config.visual.duplicateStockFillColor);
    setColorValue('color-duplicate-text', config.visual.duplicateStockTextColor);
    setColorValue('color-leaderboard-zero', config.visual.leaderboardZeroMtdBgColor);

    if (config.visual.paceThresholds) {
      document.getElementById('threshold-green').value = config.visual.paceThresholds.green;
      document.getElementById('threshold-yellow').value = config.visual.paceThresholds.yellow;
      document.getElementById('threshold-red').value = config.visual.paceThresholds.red;
    }
  }

  // Populate date settings
  if (config.dates) {
    document.getElementById('skip-sundays').checked = config.dates.skipSundays;
    document.getElementById('archive-format').value = config.dates.archiveFormat || 'M/YY';
  }

  // Populate salespeople list
  renderSalespeopleList(config.salespeople || []);
}

function setColorValue(inputId, color) {
  const input = document.getElementById(inputId);
  input.value = color;
  updateColorPreview(inputId, color);
}

function updateColorPreview(inputId, color) {
  const previewId = inputId.replace('color-', 'preview-');
  const preview = document.getElementById(previewId);
  if (preview) {
    preview.style.backgroundColor = color;
  }
}

// ========================================================================
// EVENT LISTENERS
// ========================================================================

function setupEventListeners() {
        // Auto-generate display code and aliases from name
        document.getElementById('new-fullname').addEventListener('input', debounce(function (e) {
          const fullName = e.target.value.trim();
          if (fullName) {
            const parts = fullName.split(' ');
            
            // Auto-generate display code (initials)
            const code = parts.map(p => p.charAt(0).toUpperCase()).join('').substring(0, 4);
            document.getElementById('new-displaycode').value = code;
            
            // Auto-generate aliases: "FirstName, FirstName LastInitial"
            if (parts.length >= 2) {
              const firstName = parts[0];
              const lastInitial = parts[parts.length - 1].charAt(0).toUpperCase();
              const aliases = firstName + ', ' + firstName + ' ' + lastInitial;
              document.getElementById('new-aliases').value = aliases;
            } else if (parts.length === 1) {
              // Single name, just use the name
              document.getElementById('new-aliases').value = parts[0];
            }
          }
        }, 300));

        // Color input change listeners
        ['color-nondelivered', 'color-salesperson-error', 'color-duplicate-fill',
          'color-duplicate-text', 'color-leaderboard-zero'].forEach(id => {
            document.getElementById(id).addEventListener('input', function (e) {
              updateColorPreview(id, e.target.value);
            });
          });

        // Validation on input
        document.getElementById('new-fullname').addEventListener('input', debounce(validateFullName, 300));
        document.getElementById('new-aliases').addEventListener('input', debounce(validateAliases, 300));
        document.getElementById('new-displaycode').addEventListener('input', debounce(validateDisplayCode, 300));
      }

      // ========================================================================
      // SALESPERSON MANAGEMENT
      // ========================================================================

      function renderSalespeopleList(salespeople) {
        const listContainer = document.getElementById('salesperson-list');

        if (!salespeople || salespeople.length === 0) {
          listContainer.innerHTML = '<div class="help-text">No salespeople configured. Add your first team member above.</div>';
          return;
        }

        listContainer.innerHTML = salespeople.map((sp, index) => `
        <div class="salesperson-item">
          <div class="salesperson-info">
            <div class="salesperson-name">${escapeHtml(sp.fullName)}</div>
            <div class="salesperson-details">
              Code: ${escapeHtml(sp.displayCode)}
              ${sp.aliases ? ' | Aliases: ' + escapeHtml(sp.aliases) : ''}
            </div>
          </div>
          <div class="salesperson-actions">
            <button class="btn-secondary btn-small" onclick="editSalesperson('${escapeHtml(sp.fullName)}')">Edit</button>
            <button class="btn-danger btn-small" onclick="deleteSalesperson('${escapeHtml(sp.fullName)}')">Delete</button>
          </div>
        </div>
      `).join('');
      }

      window.addSalesperson = function() {
        const fullName = document.getElementById('new-fullname').value.trim();
        const aliases = document.getElementById('new-aliases').value.trim();
        const displayCode = document.getElementById('new-displaycode').value.trim();

        // Validate
        if (!fullName) {
          showValidation('fullname-validation', 'Full name is required', 'error');
          return;
        }

        if (!displayCode) {
          showValidation('displaycode-validation', 'Display code is required', 'error');
          return;
        }

        showLoading(true);

        google.script.run
          .withSuccessHandler(function (config) {
            configCache = config;
            renderSalespeopleList(config.salespeople);
            clearAddForm();
            showToast('Salesperson added successfully!', 'success');
            showLoading(false);
          })
          .withFailureHandler(function (error) {
            showToast('Error: ' + error.message, 'error');
            showLoading(false);
          })
          .addSalesperson({
            fullName: fullName,
            aliases: aliases,
            displayCode: displayCode
          });
      };

      window.editSalesperson = function(fullName) {
        const salesperson = configCache.salespeople.find(sp => sp.fullName === fullName);
        if (!salesperson) return;

        // Show edit form, hide add form
        document.getElementById('add-form').classList.add('hidden');
        document.getElementById('salesperson-list').classList.add('hidden');
        document.getElementById('edit-form').classList.remove('hidden');

        // Populate edit form
        document.getElementById('edit-original-name').value = fullName;
        document.getElementById('edit-fullname').value = salesperson.fullName;
        document.getElementById('edit-aliases').value = salesperson.aliases;
        document.getElementById('edit-displaycode').value = salesperson.displayCode;

        editingMode = true;
      };

      window.saveEdit = function() {
  const originalName = document.getElementById('edit-original-name').value;
  const fullName = document.getElementById('edit-fullname').value.trim();
  const aliases = document.getElementById('edit-aliases').value.trim();
  const displayCode = document.getElementById('edit-displaycode').value.trim();

  if (!fullName || !displayCode) {
    showToast('Full name and display code are required', 'error');
    return;
  }

  showLoading(true);

  google.script.run
    .withSuccessHandler(function (config) {
      configCache = config;
      renderSalespeopleList(config.salespeople);
      cancelEdit();
      showToast('Salesperson updated successfully!', 'success');
      showLoading(false);
    })
    .withFailureHandler(function (error) {
      showToast('Error: ' + error.message, 'error');
      showLoading(false);
    })
    .updateSalesperson(originalName, {
      fullName: fullName,
      aliases: aliases,
      displayCode: displayCode
    });
};

window.cancelEdit = function() {
  document.getElementById('edit-form').classList.add('hidden');
  document.getElementById('add-form').classList.remove('hidden');
  document.getElementById('salesperson-list').classList.remove('hidden');
  editingMode = false;
};

window.deleteSalesperson = function(fullName) {
  if (!confirm('Delete ' + fullName + '?\n\nThis will remove them from the sales team. Past sales records will not be affected.\n\nThis action cannot be undone.')) {
    return;
  }

  showLoading(true);

  google.script.run
    .withSuccessHandler(function (config) {
      configCache = config;
      renderSalespeopleList(config.salespeople);
      showToast('Salesperson deleted successfully', 'success');
      showLoading(false);
    })
    .withFailureHandler(function (error) {
      showToast('Error: ' + error.message, 'error');
      showLoading(false);
    })
    .deleteSalesperson(fullName);
};

window.clearAddForm = function() {
  document.getElementById('new-fullname').value = '';
  document.getElementById('new-aliases').value = '';
  document.getElementById('new-displaycode').value = '';
  hideValidation('fullname-validation');
  hideValidation('aliases-validation');
  hideValidation('displaycode-validation');
};

window.updateLeaderboard = function() {
  if (!confirm('Update the leaderboard with current sales team members?\n\nThis will:\n• Update the NAME column with all current salespeople\n• Preserve existing MTD SALES and 3-month AVERAGE data\n• Clear rows for removed salespeople')) {
    return;
  }

  showLoading(true);

  google.script.run
    .withSuccessHandler(function(result) {
      showToast('Leaderboard updated successfully! ' + result.count + ' salesperson(s) synced.', 'success');
      showLoading(false);
    })
    .withFailureHandler(function(error) {
      showToast('Error updating leaderboard: ' + error.message, 'error');
      showLoading(false);
    })
    .updateLeaderboard();
};

// ========================================================================
// VISUAL SETTINGS
// ========================================================================

window.saveVisualSettings = function() {
  const visual = {
    nonDeliveredColor: document.getElementById('color-nondelivered').value,
    salespersonErrorColor: document.getElementById('color-salesperson-error').value,
    duplicateStockFillColor: document.getElementById('color-duplicate-fill').value,
    duplicateStockTextColor: document.getElementById('color-duplicate-text').value,
    leaderboardZeroMtdBgColor: document.getElementById('color-leaderboard-zero').value,
    paceThresholds: {
      green: parseInt(document.getElementById('threshold-green').value) || 10,
      yellow: parseInt(document.getElementById('threshold-yellow').value) || 8,
      red: parseInt(document.getElementById('threshold-red').value) || 0
    }
  };

  showLoading(true);

  google.script.run
    .withSuccessHandler(function (config) {
      configCache = config;
      showToast('Appearance settings saved!', 'success');
      showLoading(false);
    })
    .withFailureHandler(function (error) {
      showToast('Error: ' + error.message, 'error');
      showLoading(false);
    })
    .updateConfiguration({ visual: visual });
};

window.resetVisualDefaults = function() {
  if (!confirm('Reset all appearance settings to defaults?')) {
    return;
  }

  setColorValue('color-nondelivered', '#FF0000');
  setColorValue('color-salesperson-error', '#FFEBEE');
  setColorValue('color-duplicate-fill', '#b4ff0c');
  setColorValue('color-duplicate-text', '#ff0000');
  setColorValue('color-leaderboard-zero', '#F0F8FF');
  document.getElementById('threshold-green').value = 10;
  document.getElementById('threshold-yellow').value = 8;
  document.getElementById('threshold-red').value = 0;

  showToast('Defaults restored. Click "Save Appearance" to apply.', 'success');
};

// ========================================================================
// DATE SETTINGS
// ========================================================================

window.saveDateSettings = function() {
  const skipSundaysValue = document.getElementById('skip-sundays').checked;
  const dates = {
    skipSundays: skipSundaysValue,
    mondayLogsSaturday: skipSundaysValue,
    archiveFormat: document.getElementById('archive-format').value
  };

  showLoading(true);

  google.script.run
    .withSuccessHandler(function (config) {
      configCache = config;
      showToast('Date settings saved!', 'success');
      showLoading(false);
    })
    .withFailureHandler(function (error) {
      showToast('Error: ' + error.message, 'error');
      showLoading(false);
    })
    .updateConfiguration({ dates: dates });
};

window.resetDateDefaults = function() {
  if (!confirm('Reset date settings to defaults?')) {
    return;
  }

  document.getElementById('skip-sundays').checked = true;
  document.getElementById('archive-format').value = 'M/YY';

  showToast('Defaults restored. Click "Save Date Settings" to apply.', 'success');
};

// ========================================================================
// VALIDATION FUNCTIONS
// ========================================================================

function validateFullName() {
  const fullName = document.getElementById('new-fullname').value.trim();
  const validationDiv = document.getElementById('fullname-validation');

  if (!fullName) {
    hideValidation('fullname-validation');
    return;
  }

  if (fullName.length < 2) {
    showValidation('fullname-validation', 'Name must be at least 2 characters', 'error');
    return;
  }

  if (!/^[A-Za-z\s\-']+$/.test(fullName)) {
    showValidation('fullname-validation', 'Name can only contain letters, spaces, hyphens, and apostrophes', 'error');
    return;
  }

  showValidation('fullname-validation', '✓ Valid name', 'success');
}

function validateAliases() {
  const aliases = document.getElementById('new-aliases').value.trim();

  if (!aliases) {
    hideValidation('aliases-validation');
    return;
  }

  if (!/^[A-Za-z0-9\s,\-']+$/.test(aliases)) {
    showValidation('aliases-validation', 'Aliases can only contain letters, numbers, commas, and spaces', 'error');
    return;
  }

  showValidation('aliases-validation', '✓ Valid aliases', 'success');
}

function validateDisplayCode() {
  const displayCode = document.getElementById('new-displaycode').value.trim();

  if (!displayCode) {
    hideValidation('displaycode-validation');
    return;
  }

  if (!/^[A-Za-z0-9]{2,4}$/.test(displayCode)) {
    showValidation('displaycode-validation', 'Display code must be 2-4 alphanumeric characters', 'error');
    return;
  }

  showValidation('displaycode-validation', '✓ Valid code', 'success');
}

// ========================================================================
// UI UTILITY FUNCTIONS
// ========================================================================

function showLoading(show) {
  document.getElementById('loading').classList.toggle('active', show);
}

function showValidation(elementId, message, type) {
  const element = document.getElementById(elementId);
  element.textContent = message;
  element.className = 'validation-message ' + type;
  element.classList.remove('hidden');
}

function hideValidation(elementId) {
  const element = document.getElementById(elementId);
  element.classList.add('hidden');
}

function showToast(message, type) {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.classList.add('active');

  setTimeout(function () {
    toast.classList.remove('active');
  }, 3000);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// Debounce function to limit API calls
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}
</script>
