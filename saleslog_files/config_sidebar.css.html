    <style>
      /* ========================================================================
       MATERIAL DESIGN STYLING & RESPONSIVE LAYOUT
       Mobile-first: 280px minimum, 350px desktop optimal
       ======================================================================== */

      /* CSS Variables from Server Configuration */
      :root {
        <?!= generateCssVariables(getConfiguration().visual) ?>
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: 'Roboto', 'Arial', sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #202124;
        background-color: #fff;
        padding: 0;
        margin: 0;
      }

      /* Tab Navigation */
      .tab-container {
        display: flex;
        border-bottom: 2px solid #dadce0;
        background-color: #f8f9fa;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      .tab {
        flex: 1;
        padding: 12px 8px;
        background: none;
        border: none;
        cursor: pointer;
        font-size: 12px;
        font-weight: 500;
        color: #5f6368;
        transition: all 0.2s;
        text-align: center;
        min-height: 44px;
        /* Touch-friendly */
      }

      .tab:hover {
        background-color: rgba(0, 0, 0, 0.04);
      }

      .tab.active {
        color: #1a73e8;
        border-bottom: 2px solid #1a73e8;
        margin-bottom: -2px;
      }

      /* Tab Content */
      .tab-content {
        display: none;
        padding: 16px;
        animation: fadeIn 0.2s;
      }

      .tab-content.active {
        display: block;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }

        to {
          opacity: 1;
        }
      }

      /* Form Elements */
      .form-group {
        margin-bottom: 16px;
      }

      label {
        display: block;
        font-size: 13px;
        font-weight: 500;
        color: #5f6368;
        margin-bottom: 6px;
      }

      input[type="text"],
      input[type="color"],
      input[type="number"],
      select {
        width: 100%;
        padding: 10px;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-size: 14px;
        font-family: inherit;
        transition: border-color 0.2s;
      }

      input[type="text"]:focus,
      input[type="number"]:focus,
      select:focus {
        outline: none;
        border-color: #1a73e8;
        box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.1);
      }

      input[type="color"] {
        height: 44px;
        padding: 4px;
        cursor: pointer;
      }

      input[type="checkbox"] {
        width: 18px;
        height: 18px;
        margin-right: 8px;
        cursor: pointer;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        cursor: pointer;
        padding: 8px 0;
      }

      /* Buttons */
      button {
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        padding: 10px 24px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: all 0.2s;
        min-height: 44px;
        /* Touch-friendly */
      }

      .btn-primary {
        background-color: #1a73e8;
        color: white;
      }

      .btn-primary:hover {
        background-color: #1765cc;
        box-shadow: 0 1px 2px 0 rgba(60, 64, 67, 0.3), 0 1px 3px 1px rgba(60, 64, 67, 0.15);
      }

      .btn-secondary {
        background-color: #fff;
        color: #1a73e8;
        border: 1px solid #dadce0;
      }

      .btn-secondary:hover {
        background-color: #f8f9fa;
      }

      .btn-danger {
        background-color: #d93025;
        color: white;
      }

      .btn-danger:hover {
        background-color: #c5221f;
      }

      .btn-small {
        padding: 6px 16px;
        font-size: 13px;
        min-height: 36px;
      }

      .button-group {
        display: flex;
        gap: 8px;
        margin-top: 16px;
      }

      .button-group button {
        flex: 1;
      }

      /* Salesperson List */
      .salesperson-list {
        margin-top: 16px;
      }

      .salesperson-item {
        background-color: #f8f9fa;
        border: 1px solid #dadce0;
        border-radius: 4px;
        padding: 12px;
        margin-bottom: 8px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .salesperson-info {
        flex: 1;
      }

      .salesperson-name {
        font-weight: 500;
        font-size: 14px;
        color: #202124;
      }

      .salesperson-details {
        font-size: 12px;
        color: #5f6368;
        margin-top: 4px;
      }

      .salesperson-actions {
        display: flex;
        gap: 4px;
      }

      /* Color Preview */
      .color-preview {
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 1px solid #dadce0;
        border-radius: 3px;
        vertical-align: middle;
        margin-left: 8px;
      }

      /* Validation Messages */
      .validation-message {
        font-size: 12px;
        margin-top: 4px;
        padding: 4px 8px;
        border-radius: 3px;
      }

      .validation-message.error {
        color: #d93025;
        background-color: #fce8e6;
      }

      .validation-message.success {
        color: #137333;
        background-color: #e6f4ea;
      }

      /* Loading Indicator */
      .loading {
        display: none;
        text-align: center;
        padding: 20px;
        color: #5f6368;
      }

      .loading.active {
        display: block;
      }

      .spinner {
        border: 3px solid #f3f3f3;
        border-top: 3px solid #1a73e8;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
      }

      @keyframes spin {
        0% {
          transform: rotate(0deg);
        }

        100% {
          transform: rotate(360deg);
        }
      }

      /* Toast Notifications */
      .toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background-color: #323232;
        color: white;
        padding: 12px 24px;
        border-radius: 4px;
        font-size: 14px;
        z-index: 1000;
        display: none;
        min-width: 200px;
        text-align: center;
      }

      .toast.active {
        display: block;
        animation: slideUp 0.3s;
      }

      @keyframes slideUp {
        from {
          bottom: -50px;
          opacity: 0;
        }

        to {
          bottom: 20px;
          opacity: 1;
        }
      }

      /* Help Text */
      .help-text {
        font-size: 12px;
        color: #5f6368;
        margin-top: 4px;
      }

      /* Section Headers */
      .section-header {
        font-size: 16px;
        font-weight: 500;
        color: #202124;
        margin-bottom: 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid #dadce0;
      }

      /* Responsive adjustments */
      @media (max-width: 320px) {
        .tab {
          font-size: 11px;
          padding: 10px 4px;
        }

        .tab-content {
          padding: 12px;
        }
      }

      /* Hidden class */
      .hidden {
        display: none !important;
      }
    </style>
